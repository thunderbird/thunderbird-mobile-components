name: Publish - Snapshot

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-snapshot
  cancel-in-progress: false

jobs:
  publish-snapshot:
    name: Publish snapshot
    runs-on: macos-26
    environment: maven-central
    timeout-minutes: 60

    env:
      ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
      ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
      ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_IN_MEMORY_KEY }}
      ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_IN_MEMORY_KEY_ID }}
      ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_IN_MEMORY_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Check snapshot marker
        id: snapshot-marker
        run: |
          set -euo pipefail

          marker="snapshot/latest"
          head_commit="$(git rev-parse HEAD)"

          if git rev-parse -q --verify "refs/tags/${marker}" >/dev/null; then
            marker_commit="$(git rev-list -n 1 "${marker}")"

            if [[ "${marker_commit}" == "${head_commit}" ]]; then
              echo "Snapshot marker ${marker} already points at HEAD. Nothing to publish."
              echo "publish=false" >> "${GITHUB_OUTPUT}"
              exit 0
            fi
          fi

          echo "publish=true" >> "${GITHUB_OUTPUT}"

      - name: Setup Gradle environment
        if: steps.snapshot-marker.outputs.publish == 'true'
        uses: ./.github/actions/setup-gradle

      - name: Publish snapshot
        if: steps.snapshot-marker.outputs.publish == 'true'
        run: |
          set -euo pipefail

          ./gradlew validateSnapshotVersionForPublishing
          ./gradlew publishToMavenCentral

      - name: Write snapshot manifest
        if: steps.snapshot-marker.outputs.publish == 'true'
        run: |
          set -euo pipefail

          manifest="${RUNNER_TEMP}/snapshot-manifest.md"
          scripts/ci/write-snapshot-manifest.sh "${manifest}"
          cat "${manifest}" >> "${GITHUB_STEP_SUMMARY}"

      - name: Update snapshot marker
        if: steps.snapshot-marker.outputs.publish == 'true'
        run: |
          set -euo pipefail

          marker="snapshot/latest"
          git config user.name "TMC Snapshot Bot"
          git config user.email "tmc-snapshot-bot@thunderbird.net"
          git tag --annotate --force "${marker}" --file "${RUNNER_TEMP}/snapshot-manifest.md" HEAD
          git push --force origin "refs/tags/${marker}"
