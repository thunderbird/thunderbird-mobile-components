name: Publish - Release All Components

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-release-all
  cancel-in-progress: false

jobs:
  publish-release-all:
    name: Publish BOM release train
    runs-on: macos-26
    environment: maven-central
    timeout-minutes: 120
    env:
      ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
      ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
      ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_IN_MEMORY_KEY }}
      ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_IN_MEMORY_KEY_ID }}
      ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_IN_MEMORY_KEY_PASSWORD }}
    steps:
      - name: Validate branch
        run: |
          if [[ "${GITHUB_REF_NAME}" != "main" ]]; then
            echo "Releases must be published from main. Current ref: ${GITHUB_REF_NAME}"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Gradle environment
        uses: ./.github/actions/setup-gradle
        with:
          disable-cache: 'true'

      - name: Configure Git author
        run: |
          git config user.name "TMC Release Bot"
          git config user.email "tmc-release-bot@thunderbird.net"

      - name: Publish release train
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ci/release-all.sh
