name: Validate - Release

# Runs only for release pull requests, which finalize component changelogs. Between releases the
# component versions have no finalized changelog section, so a release dry run fails by design.
on:
  pull_request:
    paths:
      - '.github/workflows/validate-release.yml'
      - 'components/**/CHANGELOG.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-release:
    name: Dry run release
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Gradle environment
        uses: ./.github/actions/setup-gradle

      - name: Dry run release all
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ci/release-all.sh --dry-run
